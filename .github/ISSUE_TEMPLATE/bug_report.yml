name: Bug report
description: Report a reproducible GATalk beta defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private projects, local user paths, or artwork you cannot redistribute. Security issues must use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: GATalk version
      placeholder: 0.18.1 Beta 2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and display environment
      placeholder: Windows 11 24H2, 2560×1440, 150% scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use the smallest project or synthetic image that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private paths, confidential data, and unlicensed images.
          required: true
