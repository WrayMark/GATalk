[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatalk"
version = "0.18.1b1"
description = "A visual analysis and production toolkit for game environment artists."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6-Essentials==6.11.1",
    "Pillow==12.3.0",
    "numpy==2.3.5",
    "opencv-python-headless==4.13.0.92",
    "colour-science==0.4.7",
]

[project.urls]
Homepage = "https://github.com/WrayMark/GATalk"
Documentation = "https://github.com/WrayMark/GATalk#readme"
Issues = "https://github.com/WrayMark/GATalk/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "PyInstaller==6.22.0",
]

[project.scripts]
gatalk = "scenelens.__main__:main"
scenelens = "scenelens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scenelens.modules.visual_review.config" = ["*.json"]
"scenelens.modules.visual_review.schemas" = ["*.json"]
"scenelens.modules.artwork_study.config" = ["*.json"]
"scenelens.modules.artwork_study.schemas" = ["*.json"]
"scenelens.modules.asset_breakdown.config" = ["*.json"]
"scenelens.modules.asset_breakdown.schemas" = ["*.json"]
"scenelens.modules.comparative_study.schemas" = ["*.json"]
"scenelens.providers.config" = ["*.json"]
"scenelens.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that process large images or build packages",
]
